packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted

overrides:
  react-native-worklets: "0.10.1"
  react: "19.2.3"
  react-dom: "19.2.3"

allowBuilds:
  bcrypt: true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@sentry/cli": true
  "@scarf/scarf": false
  core-js: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo@57.0.27
  - '@expo/ui@57.0.22'
  - expo-auth-session@57.0.14
  - expo-linking@57.0.12
  - expo-notifications@57.0.22
  - expo-router@57.0.25
