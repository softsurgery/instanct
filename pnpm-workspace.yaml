packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted

supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64

# Keep singleton runtime packages identical across apps/* and packages/*.
# Ranges here reintroduce nested copies (e.g. react-native 0.87 vs 0.88) and break NativeWind types.
overrides:
  eslint: "9.39.5"
  eslint-plugin-react-hooks: "5.2.0"
  react-native-worklets: "0.13.0"
  react: "19.3.0"
  react-dom: "19.3.0"
  react-native: "0.88.0"
  "@react-native/virtualized-lists": "0.88.0"
  expo: "58.0.17"
  typescript: "5.9.3"
  nativewind: "4.2.7"
  react-native-reanimated: "4.7.1"
  react-native-css-interop: "0.2.7"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.2.5"
  # Optional peer on web packages otherwise auto-resolves to latest stable RN (0.87.x).
  "react-i18next>react-native": "0.88.0"
  "next-i18next>react-native": "0.88.0"
  "socket.io": "4.8.1"
  "socket.io-client": "4.8.1"
  # @types/mjml@4.18+ / 5.4 depend on unpublished @types/mjml-core ranges; deploy --legacy ignores the lockfile.
  "@types/mjml": "4.7.4"
  "@types/mjml-core": "5.1.0"

peerDependencyRules:
  allowedVersions:
    react-native: "*"
    react: "*"
    react-dom: "*"
    expo: "*"
    "@react-native/virtualized-lists": "*"

packageExtensions:
  react-i18next:
    peerDependencies:
      react-native: "0.88.0"
    peerDependenciesMeta:
      react-native:
        optional: true

allowBuilds:
  bcrypt: true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@sentry/cli": true
  "@scarf/scarf": false
  core-js: false

minimumReleaseAgeExclude:
  - '@expo/*'
  - 'expo*'
  - 'babel-preset-expo*'

