events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Production apps publish these ports on the host. Nginx is a separate
    # compose project, so it reaches them through the host gateway.
    upstream api_prod {
        server host.docker.internal:5000;
    }

    upstream web_prod {
        server host.docker.internal:3000;
    }

    upstream landing_prod {
        server host.docker.internal:3001;
    }

    # ── Dev upstreams (local machine) ──
    upstream api_dev {
        server host.docker.internal:5005;
    }

    upstream web_dev {
        server host.docker.internal:3007;
    }

    upstream landing_dev {
        server host.docker.internal:3008;
    }

    upstream mobile_dev {
        server host.docker.internal:8081;
    }

    # ── Production: api.instanct.com → Docker container ──
    server {
        listen 80;
        server_name api.instanct.com;

        include /etc/nginx/snippets/acme.conf;

        location / {
            include /etc/nginx/snippets/redirect-https.conf;
            proxy_pass http://api_prod;
            include /etc/nginx/snippets/proxy.conf;
        }
    }

    # ── Production: app.instanct.com → Docker container ──
    server {
        listen 80;
        server_name app.instanct.com;

        include /etc/nginx/snippets/acme.conf;

        location / {
            include /etc/nginx/snippets/redirect-https.conf;
            proxy_pass http://web_prod;
            include /etc/nginx/snippets/proxy.conf;
            proxy_read_timeout 86400;
        }
    }

    # ── Production: instanct.com → Docker container ──
    server {
        listen 80;
        server_name instanct.com www.instanct.com;

        include /etc/nginx/snippets/acme.conf;

        location / {
            include /etc/nginx/snippets/redirect-https.conf;
            proxy_pass http://landing_prod;
            include /etc/nginx/snippets/proxy.conf;
            proxy_read_timeout 86400;
        }
    }

    # ── Dev: api-dev.instanct.com → local machine ──
    server {
        listen 80;
        server_name api-dev.instanct.com;

        include /etc/nginx/snippets/acme.conf;

        location / {
            include /etc/nginx/snippets/redirect-https.conf;
            proxy_pass http://api_dev;
            include /etc/nginx/snippets/proxy.conf;
        }
    }

    # ── Dev: app-dev.instanct.com → local machine ──
    server {
        listen 80;
        server_name app-dev.instanct.com;

        include /etc/nginx/snippets/acme.conf;

        location / {
            include /etc/nginx/snippets/redirect-https.conf;
            proxy_pass http://web_dev;
            include /etc/nginx/snippets/proxy.conf;
            proxy_read_timeout 86400;
        }
    }

    # ── Dev: landing-dev.instanct.com → local machine ──
    server {
        listen 80 default_server;
        server_name landing-dev.instanct.com localhost;

        include /etc/nginx/snippets/acme.conf;

        location / {
            include /etc/nginx/snippets/redirect-https.conf;
            proxy_pass http://landing_dev;
            include /etc/nginx/snippets/proxy.conf;
            proxy_read_timeout 86400;
        }
    }

    # ── Dev: mobile-dev.instanct.com → local machine (Expo) ──
    server {
        listen 80;
        server_name mobile-dev.instanct.com;

        include /etc/nginx/snippets/acme.conf;

        location / {
            include /etc/nginx/snippets/redirect-https.conf;
            proxy_pass http://mobile_dev;
            include /etc/nginx/snippets/proxy.conf;
            proxy_read_timeout 86400;
        }
    }

    # ── Sentry: sentry.instanct.com → self-hosted Sentry ──
    # Left on HTTP until the hostname has a DNS record and is added to the certificate.
    server {
        listen 80;
        server_name sentry.instanct.com;

        location / {
            proxy_pass http://host.docker.internal:9090;
            include /etc/nginx/snippets/proxy.conf;
            proxy_read_timeout 86400;
            proxy_buffering off;
            client_max_body_size 100m;
        }
    }

    # HTTPS server blocks are copied here once a certificate exists.
    include /etc/nginx/https.conf;
}
