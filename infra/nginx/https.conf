# Loaded only after /etc/letsencrypt/live/instanct.com exists.

server {
    listen 443 ssl;
    http2 on;
    server_name api.instanct.com;

    include /etc/nginx/snippets/ssl.conf;

    location / {
        proxy_pass http://api_prod;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.instanct.com;

    include /etc/nginx/snippets/ssl.conf;

    location / {
        proxy_pass http://web_prod;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name instanct.com www.instanct.com;

    include /etc/nginx/snippets/ssl.conf;

    location / {
        proxy_pass http://landing_prod;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 86400;
    }
}

