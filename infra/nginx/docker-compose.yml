# Isolated reverse proxy. Start it on its own:
#   docker compose -f infra/nginx/docker-compose.yml up -d
name: instanct-nginx

services:
  nginx:
    image: nginx:alpine
    container_name: instanct_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
