# Isolated reverse proxy. Start it on its own:
#   docker compose -f infra/nginx/docker-compose.yml up -d
# Issue the public certificate (after nginx is up):
#   infra/nginx/issue-certs.sh
name: instanct-nginx

services:
  nginx:
    image: nginx:alpine
    container_name: instanct_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./https.conf:/opt/nginx/https.conf:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  certbot-renew:
    image: certbot/certbot
    container_name: instanct_certbot_renew
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
      - ./renew.sh:/renew.sh:ro
    entrypoint: ["/bin/sh", "/renew.sh"]

volumes:
  certbot_www:
  certbot_certs:
