  # minio-setup:
  #   image: minio/mc:latest
  #   container_name: instanct_minio_setup_dev
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #   entrypoint: >
  #     /bin/sh -c "
  #     sleep 5;
  #     /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
  #     /usr/bin/mc mb myminio/uploads || true;
  #     /usr/bin/mc anonymous set public myminio/uploads;
  #     "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: instanct-api:dev
    container_name: instanct_api_dev
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    #   minio-setup:
    #     condition: service_completed_successfully
    env_file: env/dev/api.env
    ports:
      - "5005:5005"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        WEB_ENV_FILE: env/dev/web.env
    image: instanct-web:dev
    container_name: instanct_web_dev
    restart: on-failure
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: env/dev/web.env
    ports:
      - "3007:3007"

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        LANDING_ENV_FILE: env/dev/landing.env
    image: instanct-landing:dev
    container_name: instanct_landing_dev
    restart: on-failure
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: env/dev/landing.env
    ports:
      - "3008:3008"

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        MOBILE_ENV_FILE: env/dev/mobile.env
    image: instanct-mobile:dev
    container_name: instanct_mobile_dev
    restart: on-failure
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: env/dev/mobile.env
    ports:
      - "${MOBILE_PORT:-8081}:8081"
    stdin_open: true
    tty: true

