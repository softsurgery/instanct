name: Docker CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare web build env
        run: |
          mkdir -p apps/web
          cat > apps/web/.env.build <<'EOF'
          NEXT_PUBLIC_API_URL=http://localhost:5000
          EOF

      - name: Build API image
        run: docker build -f apps/api/dockerfile -t instanct-api:ci .

      - name: Build web image
        run: docker build -f apps/web/dockerfile -t instanct-backoffice:ci .
